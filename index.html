<script>
// ===== Chemistry Unit 2, NC1 (Nuclear Chemistry) question bank =====
// Wording follows Concept 3 Notes (CP), the study-guide key, the CP quiz key and the NC1 scale the teacher shared.
var BANK = (function(){
  function R(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function r2(x){return Math.round(x*100)/100;}
  function f2(x){return (Math.round(x*100)/100).toString();}
  function fromPool(pool,std,lvl){return function(){var v=pick(pool);var o={};for(var k in v)o[k]=v[k];o.std=std;o.lvl=lvl;if(!o.type)o.type='mc';return o;};}
  function classifyPick(items,cats,n){var chosen=[];cats.forEach(function(c){chosen.push(pick(items.filter(function(i){return i[1]===c;})));});
    var rest=shuffle(items.filter(function(i){return chosen.indexOf(i)<0;}));while(chosen.length<n)chosen.push(rest.pop());
    return shuffle(chosen).map(function(i){return {t:i[0],c:i[1]};});}

  // element data used in generators (Z, symbol, name)
  var EL={1:['H','hydrogen'],2:['He','helium'],6:['C','carbon'],7:['N','nitrogen'],15:['P','phosphorus'],16:['S','sulfur'],19:['K','potassium'],20:['Ca','calcium'],27:['Co','cobalt'],28:['Ni','nickel'],38:['Sr','strontium'],39:['Y','yttrium'],43:['Tc','technetium'],44:['Ru','ruthenium'],53:['I','iodine'],54:['Xe','xenon'],55:['Cs','cesium'],56:['Ba','barium'],57:['La','lanthanum'],82:['Pb','lead'],83:['Bi','bismuth'],84:['Po','polonium'],86:['Rn','radon'],88:['Ra','radium'],90:['Th','thorium'],91:['Pa','protactinium'],92:['U','uranium'],93:['Np','neptunium'],94:['Pu','plutonium'],95:['Am','americium']};
  var ALPHA=[[92,238],[90,232],[88,226],[86,222],[84,210],[94,239],[95,241],[84,212],[94,238]];
  var BETA=[[6,14],[38,90],[53,131],[55,137],[27,60],[1,3],[15,32],[56,140],[90,234],[82,210],[19,40]];
  var HL=[['iodine-131',8,'days'],['phosphorus-32',14,'days'],['radon-222',3.8,'days'],['cobalt-60',5.3,'years'],['strontium-90',29,'years'],['cesium-137',30,'years'],['carbon-14',5730,'years'],['technetium-99m',6,'hours']];

  // ---------- A: what makes a nucleus unstable; nuclear vs chemical ----------
  var a1=fromPool([
    {prompt:'Which change is a <b>nuclear</b> reaction rather than a chemical reaction?',answer:'An atom’s nucleus loses 2 protons and 2 neutrons.',options:['An atom’s nucleus loses 2 protons and 2 neutrons.','A sodium atom gives an electron to a chlorine atom.','Two hydrogen atoms share electrons to form H₂.','Iron rusts as it combines with oxygen.'],hint:'Nuclear = changes in the nucleus. Chemical = electrons gained, lost or shared.',sol:'Only the first choice changes the <b>nucleus</b>. The others gain, lose or share <b>electrons</b>, which is chemistry.'},
    {prompt:'In a chemical reaction, which part of the atoms changes?',answer:'The electrons (gained, lost or shared)',options:['The electrons (gained, lost or shared)','The number of protons','The number of neutrons','The strong nuclear force'],hint:'Chemical bonds form between the outer parts of atoms.',sol:'Chemical reactions involve <b>electrons</b> being gained, lost or shared. The nucleus stays the same, so the elements stay the same.'},
    {prompt:'Why does a nuclear reaction usually produce a <b>different element</b>, while a chemical reaction does not?',answer:'A nuclear reaction can change the number of protons, and the number of protons decides the element.',options:['A nuclear reaction can change the number of protons, and the number of protons decides the element.','A nuclear reaction adds electrons, and electrons decide the element.','Chemical reactions destroy atoms, so no element is left.','Nuclear reactions only change the mass, never the protons.'],hint:'What identifies an element? (Concept 2: atomic number.)',sol:'The <b>atomic number (protons)</b> identifies an element. Changing the nucleus can change the protons; moving electrons cannot.'},
    {prompt:'Which statement about the energy involved is true according to the notes?',answer:'Nuclear reactions involve massive amounts of energy compared with chemical reactions.',options:['Nuclear reactions involve massive amounts of energy compared with chemical reactions.','Chemical reactions involve more energy than nuclear reactions.','Nuclear reactions involve no energy change.','Both kinds of reactions involve exactly the same energy.'],hint:'Think about what fission powers and what fusion powers.',sol:'Nuclear reactions involve <b>massive</b> amounts of energy (fission runs power plants; fusion powers the Sun).'}
  ],'A','2.0');
  var a2=function(){var q=fromPool([
    {type:'text',prompt:'Type the term: atoms of the same element that have a different number of neutrons.',accept:['isotope','isotopes'],hint:'You calculated these in Concept 2 (carbon-12, carbon-13, carbon-14).',sol:'<b>Isotopes</b>: same protons, different neutrons.'},
    {type:'text',prompt:'Type the term: an isotope with extra nuclear energy that makes it unstable and likely to decay.',accept:['radioactive isotope','radioactive isotopes','radioisotope','radioisotopes'],hint:'Two words. The first word means “gives off radiation.”',sol:'A <b>radioactive isotope</b> has excess nuclear energy, so it is unstable and more likely to decay.'},
    {type:'text',prompt:'Type the term: the small particles and rays given off during a nuclear reaction.',accept:['radiation'],hint:'Radioactivity is the emission of this.',sol:'<b>Radiation</b> = the small particles and rays released during a nuclear reaction. Radioactivity is the emission of radiation.'},
    {type:'text',prompt:'Type the term: the force between quarks that holds the protons and neutrons of a nucleus together.',accept:['strong nuclear force','strong force','nuclear force'],hint:'It is the strongest attraction we studied, and it only works over very short distances.',sol:'The <b>strong nuclear force</b> holds the nucleus together, even though the protons repel each other.'}
  ],'A','2.0')();return q;};
  var a3=fromPool([
    {prompt:'Most radioactive isotopes have more than 80 protons. Which explanation is best?',answer:'In a very large nucleus, the protons’ electric repulsion becomes greater than the short-range strong nuclear force, so the nucleus is unstable.',options:['In a very large nucleus, the protons’ electric repulsion becomes greater than the short-range strong nuclear force, so the nucleus is unstable.','Large atoms have too many electrons, which makes the nucleus fall apart.','Large atoms have no neutrons, so nothing holds them together.','The strong nuclear force gets stronger in big atoms, which pushes particles out.'],hint:'Two forces compete in the nucleus. Which one only works over short distances?',sol:'The strong nuclear force only works over a <b>short distance</b>. In a big nucleus (more than about 83 protons), <b>proton repulsion wins</b>, so the nucleus can’t hold together and it decays.'},
    {prompt:'A student says, “A nucleus with more neutrons is always more stable.” What is the best response?',answer:'Not always: a stable nucleus needs a balance of protons and neutrons, and bigger atoms need more neutrons to be stable.',options:['Not always: a stable nucleus needs a balance of protons and neutrons, and bigger atoms need more neutrons to be stable.','Yes: neutrons have no charge, so adding them always fixes any nucleus.','No: neutrons always make a nucleus unstable.','No: stability depends only on electrons.'],hint:'The notes talk about a balance.',sol:'Stability starts in the nucleus and needs a <b>balance</b> of protons and neutrons. Too many or too few neutrons can make a nucleus unstable.'},
    {prompt:'Carbon-12 is stable, but carbon-14 is radioactive. What is different about carbon-14?',answer:'It has 2 extra neutrons, which unbalances the nucleus and gives it excess nuclear energy.',options:['It has 2 extra neutrons, which unbalances the nucleus and gives it excess nuclear energy.','It has 2 extra protons, so it is a different element.','It has 2 extra electrons, so it is an ion.','It has no strong nuclear force.'],hint:'Same element means same protons. What does the mass number tell you?',sol:'Both have 6 protons. Carbon-14 has 14 − 6 = 8 neutrons versus 6 in carbon-12. That imbalance makes it a <b>radioactive isotope</b> that decays (to nitrogen-14).'},
    {prompt:'Why is it so hard to turn copper into gold (the Intro to Concept 3 question)?',answer:'Copper would need 50 more protons (and many neutrons) added to its nucleus, and changing a nucleus takes massive energy.',options:['Copper would need 50 more protons (and many neutrons) added to its nucleus, and changing a nucleus takes massive energy.','Copper just needs 50 more electrons, which is easy.','Copper and gold are the same element with different charges.','Gold is a mixture, so it cannot be made.'],hint:'Copper has atomic number 29, gold 79.',sol:'79 − 29 = <b>50 protons</b> must be added to the nucleus. Electrons are easy to move; changing the nucleus takes massive energy. The gold on Earth came from fusion in exploding stars.'}
  ],'A','3.0');
  var a6=fromPool([
    {prompt:'Over many years, a sample of polonium slowly becomes lead. A piece of iron that rusts is still iron. What explains the difference?',answer:'Polonium’s nucleus changes (it loses protons by decay), but rusting only moves electrons, so iron keeps its protons.',options:['Polonium’s nucleus changes (it loses protons by decay), but rusting only moves electrons, so iron keeps its protons.','Polonium gains electrons, which turns it into lead.','Rusting changes iron’s nucleus but not enough to make a new element.','Both are chemical reactions that happen at different speeds.'],hint:'Which change involves the nucleus? What decides which element it is?',sol:'Polonium (84) → lead (82): protons left the <b>nucleus</b>, so the element changed. Rust is a <b>chemical</b> change: electrons move, protons stay, so it is still iron.'},
    {prompt:'Why is radioactive decay called <b>spontaneous</b>?',answer:'An unstable nucleus can no longer hold itself together, so it gives off radiation on its own without being triggered.',options:['An unstable nucleus can no longer hold itself together, so it gives off radiation on its own without being triggered.','It only happens when scientists fire neutrons at it.','It only happens when the atom gains electrons.','It happens only once every 5,730 years.'],hint:'Compare: fission can be started by a neutron. Does decay need a trigger?',sol:'Decay happens <b>on its own</b> because the nucleus is unstable (too much nuclear energy) and loses energy and matter by emitting radiation.'},
    {prompt:'Which isotope is most likely to be radioactive, and why?',answer:'Uranium-238, because it has more than 83 protons, so proton repulsion beats the strong nuclear force.',options:['Uranium-238, because it has more than 83 protons, so proton repulsion beats the strong nuclear force.','Carbon-12, because it is small and light.','Oxygen-16, because it has equal protons and neutrons.','Iron-56, because iron is a metal.'],hint:'Look at the number of protons in each.',sol:'Uranium has 92 protons. Above about 83 protons, the <b>repulsion</b> between protons is greater than the short-range <b>strong nuclear force</b>, so every isotope is unstable.'}
  ],'A','3.0');
  var A_ITEMS=[['An electron is transferred from Na to Cl','Chemical'],['Methane burns in oxygen','Chemical'],['Two atoms share electrons to form a bond','Chemical'],['Uranium-238 gives off an alpha particle','Nuclear'],['Hydrogen nuclei fuse in the Sun','Nuclear'],['A neutron splits a uranium-235 nucleus','Nuclear'],['Carbon-14 changes into nitrogen-14','Nuclear'],['Iron reacts with oxygen to form rust','Chemical']];
  function a4(){var cats=['Nuclear','Chemical'];return {std:'A',lvl:'2.0',type:'classify',prompt:'Is each change a nuclear reaction or a chemical reaction?',cats:cats,items:classifyPick(A_ITEMS,cats,4),
    hint:'Ask: did the nucleus change (protons or neutrons), or did electrons move?',sol:'Nuclear: the nucleus changes (decay, fission, fusion; one element becomes another). Chemical: electrons are gained, lost or shared; the elements stay the same.'};}
  function a5(){var e=pick(ALPHA.concat(BETA)),Z=e[0],A=e[1],n=A-Z;
    return {std:'A',lvl:'2.0',type:'num',prompt:'How many <b>neutrons</b> are in the nucleus of '+EL[Z][1]+'-'+A+'? (Atomic number of '+EL[Z][1]+' = '+Z+'.)',answer:n,unit:'neutrons',tol:0.005,
      hint:'Neutrons = mass number − atomic number (from Concept 2).',sol:A+' − '+Z+' = <b>'+n+' neutrons</b>. The mass number counts protons + neutrons; the atomic number counts protons.',params:{Z:Z,A:A}};}

  // ---------- B: radioactive decay, alpha/beta/gamma, half-life ----------
  var b1=fromPool([
    {prompt:'Which radiation is <b>2 protons and 2 neutrons</b> leaving the nucleus?',answer:'Alpha (α)',options:['Alpha (α)','Beta (β)','Gamma (γ)','Electron capture'],hint:'It is the same as a helium nucleus.',sol:'An <b>alpha particle (α)</b> = 2 p⁺ + 2 n⁰ (a helium-4 nucleus).'},
    {prompt:'Which radiation is <b>one electron</b> released from the nucleus when a neutron splits into a proton and an electron?',answer:'Beta (β)',options:['Beta (β)','Alpha (α)','Gamma (γ)','Fusion'],hint:'Its symbol is the second Greek letter.',sol:'A <b>beta particle (β)</b> = 1 e⁻. The neutron becomes a proton and the electron leaves.'},
    {prompt:'Which radiation is a form of <b>electromagnetic energy</b> with no mass, often given off along with alpha or beta?',answer:'Gamma (γ)',options:['Gamma (γ)','Alpha (α)','Beta (β)','Chain reaction'],hint:'It sits at the high-energy end of the electromagnetic spectrum.',sol:'<b>Gamma rays (γ)</b> are electromagnetic energy, not particles, and often come with alpha or beta decay.'},
    {prompt:'Which radiation is <b>most penetrating</b> and needs thick lead or concrete to block it?',answer:'Gamma (γ)',options:['Gamma (γ)','Alpha (α)','Beta (β)','They are all stopped by paper'],hint:'The one with no mass and no charge gets through the most.',sol:'Penetrating ability: <b>alpha</b> is stopped by paper or skin, <b>beta</b> by thin aluminum, <b>gamma</b> needs thick lead or concrete.'},
    {prompt:'Which radiation is <b>least penetrating</b> and can be stopped by a sheet of paper?',answer:'Alpha (α)',options:['Alpha (α)','Gamma (γ)','Beta (β)','All radiation goes through paper'],hint:'The biggest, most massive particle.',sol:'<b>Alpha</b> particles are big and heavy, so a sheet of paper (or the outer layer of skin) stops them.'}
  ],'B','2.0');
  function b2(){ // half-life calculation

<script>
var GRADE=(function(){
  function lev(a,b){var m=a.length,n=b.length,d=[];for(var i=0;i<=m;i++){d[i]=[i];}for(var j=0;j<=n;j++)d[0][j]=j;
    for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
  function norm(s){return String(s).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\b(the|a|an)\b/g,' ').replace(/\s+/g,' ').trim();}
  function parseNum(s){
    s=String(s).replace(/[\u2212\u2013\u2014]/g,'-').replace(/,/g,'').replace(/\s+/g,'');
    var m=s.match(/[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i);
    if(!m)return NaN; return parseFloat(m[0]);
  }
  // returns {ok, msg}
  function checkNum(input,ans,tol){
    var v=parseNum(input); if(isNaN(v))return {ok:false,blank:true,msg:'Type a number.'};
    tol=tol||0.02; var abs=Math.max(Math.abs(ans)*tol,0.005);
    if(Math.abs(v-ans)<=abs)return {ok:true};
    if(ans!==0&&Math.abs(-v-ans)<=abs)return {ok:false,msg:'Right size, wrong sign. Check whether it went up (+) or down (−).'};
    if(Math.abs(v-ans)<=Math.max(Math.abs(ans)*0.08,0.01))return {ok:false,msg:'Very close. Check your rounding.'};
    return {ok:false,msg:'Not yet.'};
  }
  function checkAngle(input,ans){
    var v=parseNum(input); if(isNaN(v))return {ok:false,blank:true,msg:'Type an angle in degrees.'};
    function d(a,b){var x=((a-b)%360+540)%360-180;return Math.abs(x);}
    if(d(v,ans)<=1.0)return {ok:true};
    if(d(v+180,ans)<=1.0)return {ok:false,msg:'You are 180° off. Check the quadrant: are x and y positive or negative?'};
    if(d(-v,ans)<=1.0)return {ok:false,msg:'Right reference angle, wrong quadrant. Check the sign of y (up is +, down is −).'};
    if(d(180-v,ans)<=1.0)return {ok:false,msg:'Right reference angle, wrong quadrant. Check the sign of x (right is +, left is −).'};
    if(d(90-v,ans)<=1.0||d(v-90,ans)<=1.0&&d(v,ans)>5)return {ok:false,msg:'It looks like you measured from the y-axis. Measure counterclockwise from +x (east).'};
    if(d(v,ans)<=3.0)return {ok:false,msg:'Very close. Check your rounding.'};
    return {ok:false,msg:'Not yet.'};
  }
  function checkText(input,accept){
    var t=norm(input); if(!t)return {ok:false,blank:true,msg:'Type an answer.'};
    for(var i=0;i<accept.length;i++){var a=norm(accept[i]); if(t===a)return {ok:true};
      var lim=a.length>=9?2:(a.length>=5?1:0); if(lim&&lev(t,a)<=lim)return {ok:true,msg:'Accepted. Watch the spelling: '+accept[i]+'.'};}
    return {ok:false,msg:'Not yet.'};
  }
  return {parseNum:parseNum,checkNum:checkNum,checkAngle:checkAngle,checkText:checkText,norm:norm,lev:lev};
})();

<script>
(function(){

var S={name:'',start:null,screen:0,prac:{},mastery:null,mres:null,more:null,honors:null};

// ---------- static content ----------
var TERMS=[
 ['Nuclear chemistry','The study of changes to the nucleus of an atom. A nuclear reaction changes the nucleus (radioactive decay, fission, fusion).'],
 ['Nuclear vs. chemical reaction','Nuclear: the nucleus changes, so the element can change. Chemical: electrons are gained, lost or shared; the nucleus and the element stay the same.'],
 ['Stable nucleus','A balance of protons and neutrons, held by the strong nuclear force. Bigger atoms need more neutrons. Above about 83 protons, proton repulsion wins and the nucleus is unstable.'],
 ['Isotope / radioactive isotope','Isotopes: same element, different neutrons. Radioactive isotopes have excess nuclear energy, so they are unstable and more likely to decay.'],
 ['Radioactive decay','The spontaneous process by which an unstable nucleus can no longer hold itself together, so it loses energy and matter by emitting radiation.'],
 ['Radiation / radioactivity','Radiation: the small particles and rays released during a nuclear reaction. Radioactivity: the emission of radiation.'],
 ['Alpha (α)','2 p⁺ + 2 n⁰ (a helium-4 nucleus). Atomic number −2, mass number −4. Stopped by paper or skin.'],
 ['Beta (β)','1 e⁻. A neutron splits into a proton and an electron; the electron leaves. Atomic number +1, mass number unchanged. Stopped by thin aluminum.'],
 ['Gamma (γ)','Electromagnetic energy. No change in atomic or mass number. Often comes with alpha or beta. Needs thick lead or concrete.'],
 ['Half-life','The time for half of the unstable nuclei in a sample to decay. After each half-life the amount is cut in half: 100% → 50% → 25% → 12.5% …'],
 ['Fission','Splitting 1 larger atom into 2 or more smaller ones. Can happen on its own or when a neutron hits the nucleus. Can cause chain reactions. Used in nuclear reactors. Makes radioactive waste.'],
 ['Fusion','Combining 2 or more lighter atoms into a larger one. Happens in stars; needs huge energy; makes no radioactive waste. Example: ¹H + ²H → ³He + energy.'],
 ['Chain reaction','An ongoing series of reactions, causing an exponential result.'],
 ['Nucleosynthesis','The formation of new elements through nuclear chemistry. The Sun makes helium; heavier elements (iron, gold) come from bigger, hotter stars and their explosions.'],
 ['Counting particles','Protons = atomic number. Neutrons = mass number − atomic number.'],
 ['Applications','Power plants, cancer treatment, carbon dating, medical imaging tracers, space probe power, criminology, agriculture, food irradiation, weapons. Every use has benefits and drawbacks.']
];

var SVG_PEN='<svg viewBox="0 0 320 150" role="img" aria-label="Alpha stopped by paper, beta stopped by aluminum, gamma stopped by thick lead" style="max-width:360px;width:100%;display:block;margin:6px auto"><g font-family="system-ui,sans-serif" font-size="13" fill="var(--ink)"><text x="4" y="34">α</text><text x="4" y="79">β</text><text x="4" y="124">γ</text><text x="92" y="146">paper</text><text x="158" y="146">aluminum</text><text x="242" y="146">lead</text></g><rect x="100" y="12" width="6" height="122" fill="var(--muted)" opacity=".6"/><rect x="170" y="12" width="10" height="122" fill="var(--muted)" opacity=".8"/><rect x="240" y="12" width="34" height="122" fill="var(--ink)" opacity=".55"/><g stroke="var(--accent)" stroke-width="3"><line x1="20" y1="30" x2="96" y2="30"/><line x1="20" y1="75" x2="166" y2="75"/><path d="M20 120 q8 -8 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none"/></g></svg>';

var LEARN={
A:'<p class="secmeta">NC1 · Nuclear vs. chemical &amp; stability · Learn · about 4 minutes</p><h1>Nuclear vs. chemical &amp; stability</h1>'+
'<div class="panel"><h2>Where the change happens</h2><p><b>Nuclear chemistry</b> is the study of changes to the <b>nucleus</b>. When the nucleus changes, a nuclear reaction happens: radioactive decay, fission or fusion. A <b>chemical</b> reaction is different: electrons are gained, lost or shared, and the nucleus does not change.</p>'+
'<div class="tw"><table><tr><th></th><th>Chemical reaction</th><th>Nuclear reaction</th></tr><tr><td>What changes</td><td>Electrons</td><td>Protons and/or neutrons</td></tr><tr><td>Same element after?</td><td>Yes</td><td>Often no (protons change)</td></tr><tr><td>Energy</td><td>Smaller</td><td>Massive</td></tr></table></div></div>'+
'<div class="panel"><h2>Why some nuclei are unstable</h2><p>The nucleus is held together by the <b>strong nuclear force</b> between quarks, even though protons repel each other. A <b>stable</b> nucleus has a balance of protons and neutrons, and bigger atoms need more neutrons. The strong force only works over a <b>short distance</b>, so in a very big nucleus (more than about 83 protons) the repulsion between protons wins. <b>Radioactive isotopes</b> have excess nuclear energy, so they are unstable and more likely to decay.</p></div>'+
'<div class="move"><h3>The 3.0 move: explain the cause, not just the name</h3><p>Use a chain: <b>what is unbalanced in the nucleus → which force wins → what the nucleus does about it → what that produces</b>. “Uranium is radioactive” is 2.0. “Uranium has 92 protons, so proton repulsion beats the short-range strong force, so the nucleus emits radiation to become more stable” is 3.0.</p></div>'+
'<div class="ex"><h3>Worked example 1: carbon-12 vs. carbon-14</h3><p>Both have 6 protons. Carbon-12 has 6 neutrons; carbon-14 has 14 − 6 = <b>8</b>. The extra neutrons unbalance the nucleus, so carbon-14 is a radioactive isotope. It decays into nitrogen-14 (7 protons): a new element, because the nucleus changed.</p></div>'+
'<div class="ex"><h3>Worked example 2: nuclear or chemical?</h3><p>Burning methane: carbon and hydrogen atoms rearrange their bonds (electrons). The atoms afterward are still carbon, hydrogen and oxygen: <b>chemical</b>. Radium-226 becoming radon-222: the number of protons dropped from 88 to 86: <b>nuclear</b>.</p></div>'+
'<div class="miss"><h3>Ideas students usually miss</h3><ul><li>Protons decide the element. Change the protons and you change the element.</li><li>Isotopes are not all radioactive; only unstable ones are.</li><li>The strong nuclear force is strong but short-range; that is why big nuclei fall apart.</li></ul></div>',

B:'<p class="secmeta">NC1 · Radioactive decay &amp; half-life · Learn · about 4 minutes</p><h1>Radioactive decay &amp; half-life</h1>'+
'<div class="panel"><h2>Three kinds of radiation</h2><p><b>Radioactive decay</b> is spontaneous: an unstable nucleus can no longer hold itself together, so it loses energy and matter by emitting <b>radiation</b>.</p>'+
'<div class="tw"><table><tr><th></th><th>Alpha</th><th>Beta</th><th>Gamma</th></tr><tr><td>Symbol</td><td>α</td><td>β</td><td>γ</td></tr><tr><td>What is released</td><td>2 p⁺ + 2 n⁰</td><td>1 e⁻ (a neutron → proton + electron)</td><td>Electromagnetic energy</td></tr><tr><td>Atomic number</td><td>−2</td><td>+1</td><td>no change</td></tr><tr><td>Mass number</td><td>−4</td><td>no change</td><td>no change</td></tr><tr><td>Stopped by</td><td>Paper or skin</td><td>Thin aluminum</td><td>Thick lead or concrete</td></tr></table></div>'+SVG_PEN+
'<p>Examples from your notes: ²³⁸U → ⁴He + ²³⁴Th (alpha) and ¹⁴C → ⁰₋₁e + ¹⁴N (beta).</p></div>'+
'<div class="panel"><h2>Half-life</h2><p>The <b>half-life</b> is the time for <b>half of the unstable nuclei in a sample</b> to decay. It is the same every time, so you can count by halves: 100% → 50% → 25% → 12.5% → 6.25%. Carbon-14’s half-life is 5,730 years, which is how radioactive dating finds the age of old samples.</p><p><b>Steps:</b> number of half-lives = time ÷ half-life. Then cut the amount in half that many times.</p></div>'+
'<div class="move"><h3>The 3.0 move: follow the particles</h3><p>Ask “what left the nucleus?” Alpha takes 2 protons and 2 neutrons, so the element drops 2 places on the periodic table. Beta turns a neutron into a proton, so the element moves up 1. Gamma only carries away energy. Use those changes as <b>evidence</b> to name the decay.</p></div>'+
'<div class="ex"><h3>Worked example 1: what does alpha decay make?</h3><p>Thorium-232 (atomic number 90) gives off an alpha particle. New atomic number: 90 − 2 = <b>88</b> (radium). New mass number: 232 − 4 = <b>228</b>. Product: radium-228.</p></div>'+
'<div class="ex"><h3>Worked example 2: half-life</h3><p>Iodine-131 has a half-life of 8 days. Start with 40 g. After 24 days: 24 ÷ 8 = 3 half-lives. 40 → 20 → 10 → <b>5 g</b> left.</p></div>'+
'<div class="ex"><h3>Worked example 3: identify the radiation</h3><p>Paper does not block it, but thin aluminum does. Not alpha (paper would stop it), not gamma (aluminum would not stop it): <b>beta</b>.</p></div>'+
'<div class="miss"><h3>Ideas students usually miss</h3><ul><li>Half-life is about half of a <b>sample</b>, not half of one atom.</li><li>After two half-lives, ¼ is left, not none.</li><li>Beta decay raises the atomic number even though an electron leaves.</li><li>Gamma has the least mass but goes the farthest.</li></ul></div>',

C:'<p class="secmeta">NC1 · Fission &amp; fusion · Learn · about 4 minutes</p><h1>Fission &amp; fusion</h1>'+
'<div class="panel"><div class="tw"><table><tr><th></th><th>Fission</th><th>Fusion</th></tr><tr><td>What happens</td><td>1 larger atom splits into 2 or more smaller ones</td><td>2 or more lighter atoms combine into 1 larger one</td></tr><tr><td>How it starts</td><td>On its own, or a neutron is fired into the nucleus</td><td>Huge energy (star conditions)</td></tr><tr><td>Where</td><td>Nuclear power plants (reactors)</td><td>Stars, like the Sun</td></tr><tr><td>Products</td><td>Smaller nuclei, neutrons, radioactive waste</td><td>A larger nucleus, no radioactive waste</td></tr><tr><td>Energy</td><td>Tons of energy from very little fuel</td><td>The Sun’s energy (sunlight)</td></tr><tr><td>Special feature</td><td>Can cause a <b>chain reaction</b></td><td>Makes new elements: <b>nucleosynthesis</b></td></tr></table></div>'+
'<p><b>Chain reaction:</b> an ongoing series of reactions causing an exponential result. Neutrons from one fission split more nuclei, which release more neutrons.</p><p><b>Nucleosynthesis:</b> the formation of new elements through nuclear reactions. The Sun is only hot enough to make helium; heavier elements (iron, gold) were made in bigger, hotter stars that exploded billions of years ago.</p></div>'+
'<div class="move"><h3>The 3.0 move: compare on three things</h3><p>When you compare decay, fission and fusion, always cover <b>radiation or particles released</b>, <b>products</b>, and <b>energy</b>. Then connect to a use or a risk.</p></div>'+
'<div class="ex"><h3>Worked example 1: a chain reaction in numbers</h3><p>If each fission causes 2 more: 1 → 2 → 4 → 8 → 16 → 32. After 10 rounds there are 1,024 fissions at once. That exponential growth gives huge energy, and it is why reactors must control it.</p></div>'+
'<div class="ex"><h3>Worked example 2: why reactors use fission</h3><p>Fusion needs star-like energy to start, so it is still being researched. Fission can be started by a neutron, so power plants use it, accepting the drawback of radioactive waste.</p></div>'+
'<div class="miss"><h3>Ideas students usually miss</h3><ul><li><b>Fission</b> splits (think “fissure,” a crack); <b>fusion</b> fuses.</li><li>The Sun uses fusion, not fission.</li><li>Fusion makes no radioactive waste (according to your notes) but is hard to start.</li></ul></div>',

D:'<p class="secmeta">NC1 · Applications &amp; risks · Learn · about 4 minutes</p><h1>Applications &amp; risks</h1>'+
'<div class="panel"><h2>Uses from your research project</h2><div class="tw"><table><tr><th>Use</th><th>Benefit</th><th>Drawback</th></tr>'+
'<tr><td>Nuclear power (fission)</td><td>Lots of energy from little fuel; no greenhouse gases</td><td>Radioactive waste; water pollution; worker exposure; accidents (Chernobyl)</td></tr>'+
'<tr><td>Cancer treatment</td><td>Kills cancer cells</td><td>Can damage healthy cells; waste must be stored</td></tr>'+
'<tr><td>Radioactive dating</td><td>Finds the age of samples</td><td>Samples can be contaminated</td></tr>'+
'<tr><td>Medical imaging tracers</td><td>Shows how organs work</td><td>Patient is exposed to radiation</td></tr>'+
'<tr><td>Space exploration power</td><td>Long-lasting power far from the Sun</td><td>Launch accidents could spread radioactive material</td></tr>'+
'<tr><td>Nuclear weapons</td><td>(Deterrence is debated)</td><td>Massive destruction and fallout</td></tr></table></div></div>'+
'<div class="panel"><h2>Using evidence to judge a use</h2><p>Match the <b>type of radiation</b> to the job using penetrating ability: something a camera must detect from outside the body needs gamma; an alpha source is safe behind a cover but dangerous if swallowed or inhaled. Use <b>half-life</b> to judge how long a risk lasts: a 6-hour tracer is mostly gone in a couple of days; waste with a long half-life must be stored for many years.</p></div>'+
'<div class="move"><h3>The 3.0 move: claim, evidence, reasoning</h3><p><b>Claim:</b> “This isotope is a good choice for …” <b>Evidence:</b> its radiation type and half-life. <b>Reasoning:</b> how those properties produce the benefit and how big the risk is. Always name one benefit <i>and</i> one drawback.</p></div>'+
'<div class="ex"><h3>Worked example 1: picking a tracer</h3><p>Technetium-99m gives off gamma rays and has a 6-hour half-life. Gamma passes out of the body, so a camera can see it. After 24 hours (4 half-lives) only 100% → 50 → 25 → 12.5 → <b>6.25%</b> is left, so exposure is short. Drawback: the patient still receives some radiation.</p></div>'+
'<div class="ex"><h3>Worked example 2: a smoke detector</h3><p>Americium-241 is an alpha emitter. Alpha is stopped by air, paper or skin, so the detector is safe on the ceiling. The risk appears only if the source is broken open and swallowed or inhaled.</p></div>'+
'<div class="miss"><h3>Ideas students usually miss</h3><ul><li>“Radiation is always deadly” and “radiation is harmless” are both wrong; the risk depends on type, amount, time and whether it is inside the body.</li><li>A good answer gives a benefit <b>and</b> a drawback.</li><li>Long half-life = long-lasting source (good for space power, bad for waste).</li></ul></div>'
};

var TOOLKIT='<p class="secmeta">Toolkit · about 2 minutes</p><h1>How to think about a nuclear question</h1>'+
'<div class="panel"><ol><li><b>Nucleus or electrons?</b> Decide if the change is nuclear or chemical.</li><li><b>What left or joined the nucleus?</b> α (2p + 2n), β (1 e⁻ from a neutron), γ (energy), split (fission), combine (fusion).</li><li><b>Count it.</b> Protons = atomic number; neutrons = mass − atomic number. For half-life: number of half-lives = time ÷ half-life, then halve.</li><li><b>Compare</b> radiation, products and energy.</li><li><b>Use evidence</b> (penetrating ability, half-life, waste) to explain a use or a risk, with a benefit and a drawback.</li></ol>'+

function newQ(gen,prevPrompt){var q,k=0;do{q=gen();k++;}while(prevPrompt&&q.prompt===prevPrompt&&k<8);
  if(q.type==='mc'){q.shown=q.keepOrder?q.options.slice():BANK.shuffle(q.options);}
  if(q.type==='order'){var sh;var c=0;do{sh=BANK.shuffle(q.items);c++;}while(sh.join('|')===q.items.join('|')&&c<10);q.shown=sh;}
  return q;}

// opts: {num, maxTries, hints, onDone(correctFirstTry,correct), regen}
function qCard(q,o){
  var card=document.createElement('div');card.className='q';
  var tries=0,done=false,sel=null,picked=[];
  var lv=q.lvl==='3.0'?'l3':'l2';
  card.innerHTML='<div class="qhead"><span class="qnum">'+(o.num||'')+'</span><span class="lvl '+lv+'">'+(q.lvl==='Honors'?'Honors':'Level '+q.lvl)+'</span><span class="tries"></span></div><div class="prompt">'+q.prompt+'</div><div class="body"></div><div class="row ctl"></div><div class="fb" aria-live="polite"></div>';
  var body=card.querySelector('.body'),ctl=card.querySelector('.ctl'),fb=card.querySelector('.fb'),tr=card.querySelector('.tries');
  function setTries(){tr.textContent=done?'':(o.maxTries>1?'Try '+(tries+1)+' of '+o.maxTries:'One try');}
  var input;
  if(q.type==='mc'){var box=document.createElement('div');box.className='opts';q.shown.forEach(function(t,i){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=t;b.onclick=function(){if(done)return;sel=i;[].forEach.call(box.children,function(c){c.classList.remove('sel','wrong');});b.classList.add('sel');};box.appendChild(b);});body.appendChild(box);}
  if(q.type==='num'||q.type==='text'){var r=document.createElement('div');r.className='row';input=document.createElement('input');input.type='text';input.className='ans';input.setAttribute('aria-label','Your answer');r.appendChild(input);if(q.unit){var u=document.createElement('span');u.className='unit';u.textContent=q.unit;r.appendChild(u);}body.appendChild(r);input.addEventListener('keydown',function(e){if(e.key==='Enter')check();});}
  var selects=[];
  if(q.type==='classify'){var cl=document.createElement('div');cl.className='cls';q.items.forEach(function(it,i){var row=document.createElement('div');row.className='clsrow';var sp=document.createElement('span');sp.textContent=it.t;var s=document.createElement('select');s.setAttribute('aria-label',it.t);s.innerHTML='<option value="">Choose…</option>'+q.cats.map(function(c){return '<option>'+c+'</option>';}).join('');row.appendChild(sp);row.appendChild(s);cl.appendChild(row);selects.push(s);});body.appendChild(cl);}
  var pickBox,bankBox;
  if(q.type==='order'){body.insertAdjacentHTML('beforeend','<p class="muted" style="margin:.4em 0 0">Tap the items in order. Your order:</p>');pickBox=document.createElement('div');pickBox.className='ordpick';body.appendChild(pickBox);bankBox=document.createElement('div');bankBox.className='ordbank';body.appendChild(bankBox);
    var clr=document.createElement('button');clr.type='button';clr.className='btn small';clr.textContent='Clear my order';clr.onclick=function(){if(done)return;picked=[];drawOrder();};body.appendChild(clr);drawOrder();}
  function drawOrder(){pickBox.innerHTML=picked.length?'<ol>'+picked.map(function(i){return '<li>'+esc(q.shown[i])+'</li>';}).join('')+'</ol>':'<span class="muted">Nothing yet.</span>';bankBox.innerHTML='';
    q.shown.forEach(function(t,i){if(picked.indexOf(i)>=0)return;var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.onclick=function(){if(done)return;picked.push(i);drawOrder();};bankBox.appendChild(b);});}
  var chk=document.createElement('button');chk.type='button';chk.className='btn primary';chk.textContent='Check';chk.onclick=check;ctl.appendChild(chk);
  var hb=null;if(o.hints&&q.hint){hb=document.createElement('button');hb.type='button';hb.className='btn';hb.textContent='Hint';hb.onclick=function(){fb.className='fb hint';fb.innerHTML='<b>Hint:</b> '+q.hint;};ctl.appendChild(hb);}
  var again=null;if(o.regen){again=document.createElement('button');again.type='button';again.className='btn';again.textContent='Try another like this';again.onclick=function(){o.regen(card);};ctl.appendChild(again);}
  setTries();
  function grade(){
    if(q.type==='mc'){if(sel===null)return {blank:true,msg:'Pick an answer.'};return {ok:q.shown[sel]===q.answer};}
    if(q.type==='num')return q.angle?GRADE.checkAngle(input.value,q.answer):GRADE.checkNum(input.value,q.answer,q.tol);
    if(q.type==='text')return GRADE.checkText(input.value,q.accept);
    if(q.type==='classify'){var n=0,blank=false;selects.forEach(function(s,i){if(!s.value)blank=true;});if(blank)return {blank:true,msg:'Choose a category for every item.'};
      selects.forEach(function(s,i){var ok=s.value===q.items[i].c;if(ok)n++;s.parentNode.classList.toggle('wrong',!ok&&false);});
      return {ok:n===q.items.length,msg:n+' of '+q.items.length+' are right. Not yet.',n:n};}
    if(q.type==='order'){if(picked.length<q.shown.length)return {blank:true,msg:'Put all '+q.shown.length+' items in order first.'};var seq=picked.map(function(i){return q.shown[i];});var nr=0;seq.forEach(function(t,i){if(t===q.items[i])nr++;});return {ok:seq.join('|')===q.items.join('|'),msg:nr+' of '+q.items.length+' are in the right place. Not yet.'};}
  }
  function check(){if(done)return;var g=grade();if(g.blank){fb.className='fb no';fb.textContent=g.msg;return;}
    tries++;
    if(g.ok){finish(true,g.msg);return;}
    if(tries>=o.maxTries){finish(false,g.msg);return;}
    fb.className='fb no';fb.textContent=(g.msg||'Not yet.')+' Try again'+(o.hints&&q.hint?' or use the hint.':'.');
    if(q.type==='mc'&&sel!==null){card.querySelectorAll('.opt')[sel].classList.add('wrong');}
    setTries();}
  function finish(ok,msg){done=true;tr.textContent='';
    fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?(msg&&/Accepted/.test(msg)?msg:'Correct!'):(o.maxTries>1?'That was your last try. Here is the answer:':'Not correct. Here is the answer:');
    if(q.type==='mc'){card.querySelectorAll('.opt').forEach(function(b,i){b.disabled=true;if(q.shown[i]===q.answer)b.classList.add('right');else if(i===sel&&!ok)b.classList.add('wrong');});}
    if(input)input.disabled=true;selects.forEach(function(s,i){s.disabled=true;s.parentNode.classList.add(s.value===q.items[i].c?'right':'wrong');if(s.value!==q.items[i].c){var a=document.createElement('span');a.className='muted';a.textContent=' → '+q.items[i].c;s.parentNode.firstChild.appendChild(a);}});
    chk.disabled=true;if(hb)hb.disabled=true;
    var ans='';if(q.type==='num')ans='<p><b>Answer:</b> '+(q.answer<0?'−'+(-q.answer):q.answer)+(q.unit==='°'?'°':' '+(q.unit||''))+'</p>';if(q.type==='text')ans='<p><b>Answer:</b> '+esc(q.accept[0])+'</p>';if(q.type==='order')ans='<p><b>Order:</b> '+q.items.map(esc).join(' → ')+'</p>';
    card.insertAdjacentHTML('beforeend','<div class="sol">'+ans+q.sol+'</div>');
    if(o.onDone)o.onDone(ok&&tries===1,ok);}
  return card;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function renderPractice(m,id){
  var t=T.filter(function(x){return x.id===id;})[0];
  m.insertAdjacentHTML('beforeend','<p class="secmeta">NC1 · Practice · about 5 minutes</p><h1>Practice: '+t.name+'</h1><p class="muted">Level 2.0 foundations first, then Level 3.0 explain-and-compare questions. Up to 3 tries each. New numbers every time you press “Try another like this.”</p>');
  if(!S.prac[id])S.prac[id]=t.practice.map(function(g){return newQ(g);});
  S.prac[id].forEach(function(q,i){m.appendChild(practiceCard(t,i,q));});
  m.appendChild(nav(true,S.screen+1<SCREENS.length-2?'Next topic':'Go to mastery check'));
}
function practiceCard(t,i,q){
  var c=qCard(q,{num:(i+1)+'.',maxTries:3,hints:true,regen:function(old){var nq=newQ(t.practice[i],q.prompt);S.prac[t.id][i]=nq;var nc=practiceCard(t,i,nq);old.replaceWith(nc);nc.classList.add('flash');var f=nc.querySelector('input,button.opt,select,button.chip');if(f)f.focus();}});
  return c;}

// ---------- mastery ----------
function buildMastery(){var qs=[];T.forEach(function(t){t.mastery.forEach(function(g){var q=newQ(g);q.topic=t.id;qs.push(q);});});return qs;}
function renderMastery(m){
  if(!S.mastery){S.mastery=buildMastery();S.mres=S.mastery.map(function(){return null;});}
  m.insertAdjacentHTML('beforeend','<p class="secmeta">Mastery check · about 8 minutes</p><h1>Mastery check</h1><p>Eight questions, two per topic (one Level 2.0, one Level 3.0). <b>One try each, no hints.</b> The solution appears after you answer.</p>');
  var fin=document.createElement('button');
  S.mastery.forEach(function(q,i){var c=qCard(q,{num:(i+1)+'.',maxTries:1,hints:false,onDone:function(first,ok){S.mres[i]=ok;upd();}});
    if(S.mres[i]!==null){c.querySelector('.fb').className='fb muted';c.querySelector('.fb').textContent='Already answered: '+(S.mres[i]?'correct':'not correct')+'.';c.querySelectorAll('button,input,select').forEach(function(x){x.disabled=true;});}
    m.appendChild(c);});
  var d=nav(true,'See my results',function(){go(S.screen+1);});fin=d.lastChild;m.appendChild(d);
  function upd(){var left=S.mres.filter(function(x){return x===null;}).length;fin.disabled=left>0;fin.textContent=left>0?('Answer '+left+' more to see results'):'See my results';}
  upd();
}

// ---------- results ----------
function topicScores(){return T.map(function(t){var tot=0,ok=0;S.mastery.forEach(function(q,i){if(q.topic===t.id){tot++;if(S.mres[i])ok++;}});return {t:t,ok:ok,tot:tot,pct:tot?ok/tot:0};});}
function mins(){return S.start?Math.max(1,Math.round((Date.now()-S.start)/60000)):0;}
function renderResults(m){
  if(!S.mastery||S.mres.some(function(x){return x===null;})){go(SCREENS.indexOf('mastery'));return;}
  var ts=topicScores(),ok=S.mres.filter(Boolean).length,n=S.mres.length;
  m.insertAdjacentHTML('beforeend','<p class="secmeta">Results</p><h1>Your results'+(S.name?', '+esc(S.name):'')+'</h1>'+
  '<div class="panel"><div class="score">'+ok+' / '+n+'</div><p class="muted">Mastery check · '+Math.round(100*ok/n)+'% · about '+mins()+' minutes on this review</p>'+
  '<div class="tw"><table><tr><th>Topic (NC1)</th><th>Score</th><th>Status</th><th class="noprint"></th></tr>'+ts.map(function(x,i){var solid=x.pct>=0.75;return '<tr><td>'+x.t.name+'</td><td>'+x.ok+' / '+x.tot+'</td><td><span class="tag '+(solid?'solid':'rev')+'">'+(solid?'Solid':'Review')+'</span></td><td class="noprint"><button class="btn small" type="button" data-more="'+i+'">'+(solid?'Extra practice':'Practice more')+'</button></td></tr>';}).join('')+'</table></div>'+
  '<p class="muted" style="margin-top:.8em">Solid = at least 75% on that topic. Your results are not sent anywhere. Copy them or save them as a PDF to share with your teacher.</p></div>');
  var weak=ts.filter(function(x){return x.pct<0.75;});
  m.insertAdjacentHTML('beforeend','<div class="panel"><h2>Next steps</h2>'+(weak.length?'<p>Reread the Learn page and use <b>Practice more</b> for: '+weak.map(function(x){return x.t.name;}).join(', ')+'. Aim for a streak of 5.</p>':'<p>Every topic is solid. Try the Honors challenge, or keep a streak going with extra practice.</p>')+
  '<div class="row noprint"><button class="btn primary" type="button" id="copyR">Copy my results</button><button class="btn" type="button" id="printR">Print / save as PDF</button><button class="btn" type="button" id="retake">Retake the mastery check</button><button class="btn" type="button" id="hon">Honors challenge (optional)</button></div><div class="fb" id="copyFb" aria-live="polite"></div></div>');
  m.querySelectorAll('[data-more]').forEach(function(b){b.onclick=function(){S.more={t:ts[+b.dataset.more].t,streak:0,best:0,q:null};render();window.scrollTo(0,0);};});
  $('copyR').onclick=function(){copyText(resultsText(ts),$('copyFb'));};
  $('printR').onclick=function(){window.print();};
  $('retake').onclick=function(){S.mastery=null;S.mres=null;go(SCREENS.indexOf('mastery'));};
  $('hon').onclick=function(){S.honors={qs:BANK.honors.map(function(g){return newQ(g);})};render();window.scrollTo(0,0);};
  var d=document.createElement('div');d.className='nav';var b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Back to mastery check';b.onclick=function(){go(S.screen-1);};d.appendChild(b);m.appendChild(d);
}
function resultsText(ts){var ok=S.mres.filter(Boolean).length,n=S.mres.length;var d=new Date();
  return ['Chemistry Unit 2 Nuclear Chemistry (NC1) Review – Results','Name: '+(S.name||'(not entered)'),'Date: '+d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),'Mastery check: '+ok+'/'+n+' ('+Math.round(100*ok/n)+'%)']
  .concat(ts.map(function(x){return x.t.name+': '+x.ok+'/'+x.tot+' – '+(x.pct>=0.75?'Solid':'Review');}))
  .concat(['Time on review: about '+mins()+' minutes']).join('\n');}
function copyText(txt,fb){function ok(){fb.className='fb ok';fb.textContent='Copied. Paste it into a message to your teacher.';}
  function fallback(){var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var good=false;try{good=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);
    if(good)ok();else{fb.className='fb hint';fb.innerHTML='Copy this text by hand:<br><textarea rows="8" style="width:100%;margin-top:6px">'+esc(txt)+'</textarea>';}}
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,fallback);}else fallback();}catch(e){fallback();}}

// ---------- practice more ----------
function renderMore(m){var P=S.more,t=P.t;
  m.insertAdjacentHTML('beforeend','<p class="secmeta">NC1 · Practice more</p><h1>Practice more: '+t.name+'</h1><div class="panel"><p class="streak">Streak: <span id="stk">'+P.streak+'</span> · Best: <span id="bst">'+P.best+'</span></p><p class="muted">New problems keep coming. A first-try correct answer adds to your streak; a miss resets it. Hints are allowed but break the streak.</p></div>');
  var holder=document.createElement('div');m.appendChild(holder);
  function next(){var g=BANK.pick(t.practice);var q=newQ(g,P.q&&P.q.prompt);P.q=q;var used=false;
    var c=qCard(q,{num:'',maxTries:3,hints:true,onDone:function(first,ok){if(first&&!used){P.streak++;P.best=Math.max(P.best,P.streak);}else P.streak=0;$('stk').textContent=P.streak;$('bst').textContent=P.best;
      var nb=document.createElement('button');nb.type='button';nb.className='btn primary';nb.textContent='Next problem';nb.style.marginTop='10px';nb.onclick=next;c.appendChild(nb);nb.focus();}});
    var hb=[].filter.call(c.querySelectorAll('button'),function(b){return b.textContent==='Hint';})[0];if(hb){var old=hb.onclick;hb.onclick=function(){used=true;old();};}
    holder.innerHTML='';holder.appendChild(c);}
  next();
  var d=document.createElement('div');d.className='nav';var b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Back to results';b.onclick=function(){S.more=null;render();window.scrollTo(0,0);};
  var l=document.createElement('button');l.className='btn';l.type='button';l.textContent='Reread the Learn page';l.onclick=function(){S.more=null;go(SCREENS.indexOf('learn:'+t.id));};d.appendChild(b);d.appendChild(l);m.appendChild(d);}

function renderHonors(m){
  m.insertAdjacentHTML('beforeend','<p class="secmeta">Optional · about 3 minutes</p><h1>Honors challenge</h1><p>Three nuclear-equation problems from the Honors notes. Balance the mass numbers (top) and the atomic numbers (bottom) on both sides. Up to 3 tries, hints allowed.</p>');
  S.honors.qs.forEach(function(q,i){m.appendChild(qCard(q,{num:(i+1)+'.',maxTries:3,hints:true}));});
  var d=document.createElement('div');d.className='nav';var b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Back to results';b.onclick=function(){S.honors=null;render();window.scrollTo(0,0);};d.appendChild(b);m.appendChild(d);}

// ---------- terms dialog ----------
$('termsBody').innerHTML=termsHTML();
$('termsBtn').onclick=function(){var dl=$('terms');if(dl.showModal)dl.showModal();else dl.setAttribute('open','');};
$('termsClose').onclick=function(){var dl=$('terms');if(dl.close)dl.close();else dl.removeAttribute('open');};
$('terms').addEventListener('click',function(e){if(e.target===this&&this.close)this.close();});

window.__APP={S:S,go:go,SCREENS:SCREENS,resultsText:function(){return resultsText(topicScores());}};
render();
})();
</script>
